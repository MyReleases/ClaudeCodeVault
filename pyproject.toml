[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-vault"
version = "0.1.0"
description = "Back up, move and hand off Claude Code projects without losing chat history"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["claude", "claude-code", "anthropic", "ai", "llm", "chat-history", "backup", "migration", "cli",
            "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
]

[project.urls]
Homepage = "https://github.com/MyReleases/ClaudeCodeVault"
Issues = "https://github.com/MyReleases/ClaudeCodeVault/issues"

[project.scripts]
claude-code-vault = "claude_code_vault:main"
ccvault = "claude_code_vault:main"

[tool.setuptools]
py-modules = ["claude_code_vault"]
